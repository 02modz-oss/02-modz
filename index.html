<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>02 MODZ</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  padding:18px;

  background:
    radial-gradient(circle at 20% 20%,#ff00cc55,transparent 30%),
    radial-gradient(circle at 80% 80%,#00eaff55,transparent 30%),
    linear-gradient(135deg,#05001c,#001b45,#16002d,#001f35);

  background-size:200% 200%;
  animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
  0%{background-position:0% 0%}
  50%{background-position:100% 100%}
  100%{background-position:0% 0%}
}

/* MAIN */

.container{
  width:100%;
  max-width:500px;
  position:relative;
}

/* HEADER */

.header{
  text-align:center;
  margin-bottom:18px;
}

.logo{
  font-size:45px;
  font-weight:900;
  letter-spacing:4px;

  background:linear-gradient(
    90deg,
    #00eaff,
    #fff,
    #ff00d4,
    #00eaff
  );

  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;

  animation:logoColor 4s linear infinite;
}

@keyframes logoColor{
  0%{background-position:0%}
  100%{background-position:300%}
}

.welcome{
  margin-top:5px;
  font-size:15px;
  opacity:.8;
  letter-spacing:2px;
}

/* SPEECH */

.speech{
  text-align:center;
  margin-bottom:20px;
}

.speech button{
  border:1px solid #00eaff;
  background:#06142ccc;
  color:white;
  padding:11px 20px;
  border-radius:30px;
  cursor:pointer;
  box-shadow:0 0 15px #00eaff66;
}

/* SOCIAL GRID */

.social{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

/* CARD */

.card{
  min-height:150px;
  padding:15px 8px;
  border-radius:20px;

  background:linear-gradient(
    145deg,
    #ffffff12,
    #00000035
  );

  border:1px solid #ffffff22;

  backdrop-filter:blur(15px);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  transition:.3s;

  position:relative;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-7px);
  border-color:#00eaff;
  box-shadow:0 0 25px #00eaff55;
}

.card::before{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;
  background:#00eaff33;
  filter:blur(25px);
}

.icon{
  font-size:32px;
  margin-bottom:8px;
  position:relative;
}

.card h3{
  font-size:14px;
  margin-bottom:12px;
  position:relative;
}

.join{
  text-decoration:none;
  color:white;
  font-size:11px;
  font-weight:bold;

  padding:9px 12px;
  border-radius:20px;

  background:linear-gradient(
    90deg,
    #006eff,
    #00cfff,
    #9b00ff
  );

  background-size:200%;
  animation:btnMove 3s linear infinite;

  position:relative;
}

@keyframes btnMove{
  0%{background-position:0%}
  100%{background-position:200%}
}

.status{
  margin-top:8px;
  font-size:10px;
  position:relative;
}

.locked{
  color:#ffc400;
}

.done{
  color:#00ff9d;
}

/* FINAL BOX */

.key-box{
  display:none;
  margin-top:18px;
  padding:20px;
  text-align:center;

  border-radius:25px;

  background:
    linear-gradient(
      120deg,
      #001cff,
      #00bfff,
      #7900ff,
      #ff00bb,
      #001cff
    );

  background-size:400% 400%;

  animation:
    finalColor 6s ease infinite,
    finalGlow 2s ease-in-out infinite alternate;

  border:2px solid #fff;

  position:relative;
  overflow:hidden;
}

@keyframes finalColor{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

@keyframes finalGlow{
  from{
    box-shadow:0 0 15px #00eaff;
  }
  to{
    box-shadow:
      0 0 35px #ff00d4,
      0 0 60px #00eaff;
  }
}

.key-box::after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;

  border:2px dashed #ffffff66;
  border-radius:50%;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  animation:rotate 5s linear infinite;
}

@keyframes rotate{
  from{
    transform:translate(-50%,-50%) rotate(0deg);
  }
  to{
    transform:translate(-50%,-50%) rotate(360deg);
  }
}

.key-box>*{
  position:relative;
  z-index:2;
}

.key-box h2{
  font-size:20px;
}

.subtitle{
  margin-top:5px;
  font-size:12px;
  opacity:.9;
}

.key{
  margin:15px 0;
  padding:14px;

  border-radius:15px;

  background:#00000099;
  border:1px solid #ffffff55;

  text-align:left;
  line-height:2;

  font-size:13px;
}

.key strong{
  color:#00f7ff;
}

.copy{
  border:none;
  padding:11px 22px;
  border-radius:20px;

  color:white;
  font-weight:bold;

  background:#000000aa;
  border:1px solid #fff;

  cursor:pointer;
}

.safe{
  margin-top:10px;
  font-size:12px;
  color:#00ffae;
  font-weight:bold;
}

/* FOOTER */

footer{
  text-align:center;
  margin-top:15px;
  font-size:10px;
  opacity:.5;
}

/* MOBILE */

@media(max-width:380px){

  .social{
    gap:7px;
  }

  .card{
    min-height:140px;
    padding:10px 5px;
  }

  .logo{
    font-size:37px;
  }

  .card h3{
    font-size:12px;
  }

  .join{
    padding:8px 8px;
    font-size:9px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      02 MODZ
    </div>

    <div class="welcome">
      PREMIUM ACCESS PANEL
    </div>

  </div>

  <div class="speech">

    <button onclick="speakWelcome()">
      🔊 TAP TO START
    </button>

  </div>


  <div class="social">

    <!-- YOUTUBE -->

    <div class="card">

      <div class="icon">▶️</div>

      <h3>YouTube</h3>

      <a
        class="join"
        href="https://www.youtube.com/@02modz-X20"
        target="_blank"
        onclick="completeTask('youtube')">

        SUBSCRIBE

      </a>

      <div
        class="status locked"
        id="youtubeStatus">

        🔒 Locked

      </div>

    </div>


    <!-- TIKTOK -->

    <div class="card">

      <div class="icon">🎵</div>

      <h3>TikTok</h3>

      <a
        class="join"
        href="https://www.tiktok.com/@z4x674"
        target="_blank"
        onclick="completeTask('tiktok')">

        FOLLOW

      </a>

      <div
        class="status locked"
        id="tiktokStatus">

        🔒 Locked

      </div>

    </div>


    <!-- TELEGRAM -->

    <div class="card">

      <div class="icon">✈️</div>

      <h3>Telegram</h3>

      <a
        class="join"
        href="https://t.me/ze4xban"
        target="_blank"
        onclick="completeTask('telegram')">

        JOIN

      </a>

      <div
        class="status locked"
        id="telegramStatus">

        🔒 Locked

      </div>

    </div>

  </div>


  <!-- FINAL LOGIN -->

  <div
    class="key-box"
    id="keyBox">

    <h2>
      🎉 ACCESS UNLOCKED
    </h2>

    <div class="subtitle">
      Your login information
    </div>

    <div class="key">

      👤 <strong>USERNAME</strong><br>
      02-MODZ-SAFE

      <br>

      🔑 <strong>PASSWORD</strong><br>
      6902

    </div>

    <button
      class="copy"
      onclick="copyLogin()">

      📋 COPY LOGIN

    </button>

    <div class="safe">
      🔐 02 SAFE
    </div>

  </div>


  <footer>
    © 2026 02 MODZ
  </footer>

</div>


<script>

const tasks = {
  youtube:false,
  tiktok:false,
  telegram:false
};


function speakWelcome(){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const voice =
      new SpeechSynthesisUtterance(
        "Welcome to 02 MODZ"
      );

    voice.rate = .9;
    voice.pitch = 1.1;

    speechSynthesis.speak(voice);

  }

}


function completeTask(task){

  setTimeout(()=>{

    tasks[task] = true;

    const status =
      document.getElementById(
        task + "Status"
      );

    status.innerHTML =
      "✓ Completed";

    status.className =
      "status done";

    checkTasks();

  },500);

}


function checkTasks(){

  if(
    tasks.youtube &&
    tasks.tiktok &&
    tasks.telegram
  ){

    const box =
      document.getElementById("keyBox");

    box.style.display = "block";

    box.scrollIntoView({
      behavior:"smooth",
      block:"nearest"
    });

  }

}


function copyLogin(){

  const text =
`USERNAME: 02-MODZ-SAFE
PASSWORD: 6902`;

  if(navigator.clipboard){

    navigator.clipboard
      .writeText(text)
      .then(()=>{
        alert("✅ Login copied!");
      })
      .catch(()=>{
        alert(text);
      });

  }else{

    alert(text);

  }

}

</script>

</body>
</html>
