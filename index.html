<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 MODZ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    color:white;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 15% 20%,#00eaff55,transparent 28%),
        radial-gradient(circle at 85% 75%,#ff00d455,transparent 28%),
        linear-gradient(135deg,#030014,#071b42,#16002d);

    background-size:180% 180%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 0%}
    50%{background-position:100% 100%}
    100%{background-position:0% 0%}
}

.container{
    width:100%;
    max-width:480px;
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:18px;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:4px;

    background:
        linear-gradient(
            90deg,
            #00eaff,
            #ffffff,
            #ff00dd,
            #00eaff
        );

    background-size:300%;

    -webkit-background-clip:text;
    color:transparent;

    animation:logo 4s linear infinite;

    text-shadow:0 0 20px #00eaff55;
}

@keyframes logo{
    0%{background-position:0%}
    100%{background-position:300%}
}

.welcome{
    margin-top:5px;
    font-size:12px;
    letter-spacing:3px;
    opacity:.65;
}

/* SPEECH */

.speech{
    text-align:center;
    margin-bottom:18px;
}

.speech button{
    border:1px solid #00eaff77;
    background:#061329cc;
    color:white;
    padding:10px 20px;
    border-radius:25px;
    cursor:pointer;
    box-shadow:0 0 15px #00eaff33;
}

/* TASKS */

.social{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.card{
    min-height:145px;
    padding:12px 6px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    border-radius:20px;

    background:#ffffff0d;
    border:1px solid #ffffff20;

    backdrop-filter:blur(12px);

    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#00eaff99;
    box-shadow:0 0 22px #00eaff33;
}

.icon{
    font-size:30px;
    margin-bottom:7px;
}

.card h3{
    font-size:13px;
    margin-bottom:11px;
}

.join{
    color:white;
    text-decoration:none;

    padding:8px 11px;

    border-radius:20px;

    font-size:9px;
    font-weight:bold;

    background:
        linear-gradient(
            90deg,
            #006eff,
            #00d9ff,
            #8000ff,
            #006eff
        );

    background-size:300%;

    animation:button 4s linear infinite;
}

@keyframes button{
    from{background-position:0%}
    to{background-position:300%}
}

.status{
    margin-top:8px;
    font-size:9px;
}

.locked{
    color:#ffc400;
}

.done{
    color:#00ff9d;
    text-shadow:0 0 8px #00ff9d;
}

/* KEY BOX */

.key-box{
    display:none;

    margin-top:18px;
    padding:22px 16px;

    text-align:center;

    position:relative;
    overflow:hidden;

    border-radius:26px;

    background:
        linear-gradient(
            120deg,
            #00153d,
            #006eff,
            #5b00a8,
            #ff00bb,
            #00153d
        );

    background-size:400% 400%;

    animation:
        keyBg 7s ease infinite,
        keyGlow 2s ease-in-out infinite alternate;

    border:1px solid #ffffff77;
}

@keyframes keyBg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

@keyframes keyGlow{
    from{
        box-shadow:
            0 0 15px #00eaff55,
            0 0 30px #7b00ff33;
    }

    to{
        box-shadow:
            0 0 30px #00eaff99,
            0 0 55px #ff00dd66;
    }
}

/* ROTATING RING */

.key-box::before{
    content:"";

    position:absolute;

    width:230px;
    height:230px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:1px dashed #ffffff55;
    border-radius:50%;

    animation:rotate 7s linear infinite;

    pointer-events:none;
}

@keyframes rotate{
    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

.key-box > *{
    position:relative;
    z-index:2;
}

/* ICON */

.unlock{
    width:55px;
    height:55px;

    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:#00000033;

    border:1px solid #ffffff66;

    font-size:25px;

    box-shadow:0 0 18px #00eaff55;

    animation:float 2s ease-in-out infinite alternate;
}

@keyframes float{
    from{transform:translateY(0)}
    to{transform:translateY(-5px)}
}

/* TITLE */

.key-title{
    margin-top:10px;

    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
}

.key-subtitle{
    margin-top:4px;

    font-size:9px;
    letter-spacing:3px;

    opacity:.7;
}

/* KEY */

.key-display{
    margin:17px 0;

    padding:16px 10px;

    border-radius:16px;

    background:#00000099;

    border:1px solid #ffffff55;

    box-shadow:
        inset 0 0 18px #00eaff18,
        0 0 15px #00eaff22;
}

.key-label{
    display:block;

    font-size:9px;
    letter-spacing:3px;

    opacity:.55;

    margin-bottom:7px;
}

.key-value{
    font-size:19px;
    font-weight:900;
    letter-spacing:2px;

    color:white;

    text-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff77;
}

/* COPY */

.copy{
    border:0;

    padding:11px 24px;

    border-radius:25px;

    color:white;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;

    background:#000000aa;

    border:1px solid #ffffff88;

    transition:.25s;
}

.copy:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #00eaff88;
}

.safe{
    margin-top:12px;

    font-size:9px;
    letter-spacing:2px;

    color:#00ffb3;

    text-shadow:0 0 8px #00ffb3;
}

footer{
    text-align:center;
    margin-top:14px;
    font-size:9px;
    opacity:.45;
}

/* SMALL PHONES */

@media(max-width:360px){

    .logo{
        font-size:36px;
    }

    .social{
        gap:6px;
    }

    .card{
        min-height:135px;
    }

    .card h3{
        font-size:11px;
    }

    .join{
        font-size:8px;
        padding:8px;
    }

    .key-value{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            02 MODZ
        </div>

        <div class="welcome">
            PREMIUM ACCESS
        </div>

    </div>


    <div class="speech">

        <button onclick="speakWelcome()">
            🔊 TAP TO START
        </button>

    </div>


    <!-- SOCIAL TASKS -->

    <div class="social">

        <div class="card">

            <div class="icon">▶️</div>

            <h3>YouTube</h3>

            <a
                class="join"
                href="https://www.youtube.com/@02modz-X20"
                target="_blank"
                onclick="completeTask('youtube')">

                SUBSCRIBE

            </a>

            <div
                class="status locked"
                id="youtubeStatus">

                🔒 Locked

            </div>

        </div>


        <div class="card">

            <div class="icon">🎵</div>

            <h3>TikTok</h3>

            <a
                class="join"
                href="https://www.tiktok.com/@z4x674"
                target="_blank"
                onclick="completeTask('tiktok')">

                FOLLOW

            </a>

            <div
                class="status locked"
                id="tiktokStatus">

                🔒 Locked

            </div>

        </div>


        <div class="card">

            <div class="icon">✈️</div>

            <h3>Telegram</h3>

            <a
                class="join"
                href="https://t.me/ze4xban"
                target="_blank"
                onclick="completeTask('telegram')">

                JOIN

            </a>

            <div
                class="status locked"
                id="telegramStatus">

                🔒 Locked

            </div>

        </div>

    </div>


    <!-- KEY -->

    <div
        class="key-box"
        id="keyBox">

        <div class="unlock">
            🔐
        </div>

        <div class="key-title">
            ACCESS GRANTED
        </div>

        <div class="key-subtitle">
            YOUR PREMIUM KEY
        </div>

        <div class="key-display">

            <span class="key-label">
                KEY
            </span>

            <div class="key-value">
                02-MODZ-SAFE
            </div>

        </div>

        <button
            class="copy"
            onclick="copyKey()">

            📋 COPY KEY

        </button>

        <div class="safe">
            ✦ 02 MODZ SECURE ACCESS ✦
        </div>

    </div>


    <footer>
        © 2026 02 MODZ
    </footer>

</div>


<script>

const tasks = {
    youtube:false,
    tiktok:false,
    telegram:false
};


function speakWelcome(){

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

        const voice =
            new SpeechSynthesisUtterance(
                "Welcome to 02 MODZ"
            );

        voice.rate = .9;
        voice.pitch = 1.1;

        speechSynthesis.speak(voice);
    }
}


function completeTask(task){

    setTimeout(function(){

        tasks[task] = true;

        const status =
            document.getElementById(
                task + "Status"
            );

        status.innerHTML =
            "✓ Completed";

        status.className =
            "status done";

        checkTasks();

    },500);
}


function checkTasks(){

    if(
        tasks.youtube &&
        tasks.tiktok &&
        tasks.telegram
    ){

        const box =
            document.getElementById("keyBox");

        box.style.display = "block";

        box.scrollIntoView({
            behavior:"smooth",
            block:"nearest"
        });

        speakWelcome();
    }
}


function copyKey(){

    const key =
        "02-MODZ-SAFE";

    if(navigator.clipboard){

        navigator.clipboard
            .writeText(key)
            .then(function(){

                alert("✅ KEY COPIED!");

            })
            .catch(function(){

                alert(key);

            });

    }else{

        alert(key);

    }
}

</script>

</body>
</html>
